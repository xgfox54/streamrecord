id = "RUSTSEC-2024-0370"
reason = "proc-macro-error is an unmaintained-crate notice with no fixed version. It is reached only through glib-macros and gtk3-macros on Linux and is never compiled into the Windows build."

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa is reached only through sqlx-mysql. The product enables the sqlite driver only, and sqlx-postgres appears in Cargo.lock for the same reason: the lockfile records every optional dependency regardless of the enabled features. rsa is never compiled and no fixed version exists."

