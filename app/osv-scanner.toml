[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18 is reachable only through the GTK stack that Tauri builds for Linux. Stream-Record ships Windows x64 only; the release build log shows glib and gtk are never compiled into stream-record.exe. The 0.20 fix cannot be adopted because Tauri 2.11 pins gtk 0.18."

